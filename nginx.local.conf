# ─────────────────────────────────────────────────────────────────────
# nginx.conf — Configuración LOCAL para desarrollo con Docker
# 
# Sirve:
#   1. Bundle React SPA con HTML5 routing
#   2. Proxy a Backend CLASSROOM_PLAN_SERVICE (puerto 8001)
# ─────────────────────────────────────────────────────────────────────

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 25M;
    client_body_buffer_size 1M;

    # ── Content Security Policy ────────────────────────────────────────
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://accounts.google.com https://www.google.com https://www.gstatic.com; style-src 'self' 'unsafe-inline' https://accounts.google.com https://fonts.googleapis.com; img-src 'self' data: blob: https:; connect-src 'self' http: https: ws: wss:; frame-src 'self' blob: https://accounts.google.com https://www.google.com; font-src 'self' data: https://fonts.gstatic.com; object-src 'none'; base-uri 'self';" always;

    # ── Resolver DNS de Docker ─────────────────────────────────────────
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_host classroom-backend:8001;

    # ── Proxy API al Backend CLASSROOM_PLAN_SERVICE ─────────────────────
    location /api/ {
        proxy_pass              http://$backend_host;
        proxy_http_version      1.1;
        proxy_set_header        Host              $host;
        proxy_set_header        X-Real-IP         $remote_addr;
        proxy_set_header        X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header        X-Forwarded-Proto $scheme;
        proxy_connect_timeout   30s;
        proxy_read_timeout      300s;
        proxy_send_timeout      300s;
        # CORS headers
        add_header              'Access-Control-Allow-Origin'  '*' always;
        add_header              'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
        add_header              'Access-Control-Allow-Headers' 'Content-Type, Authorization' always;
        
        # Handle OPTIONS requests
        if ($request_method = 'OPTIONS') {
            return 204;
        }
    }

    # ── Archivos estáticos (cache agresivo) ────────────────────────────
    # PDF.js worker
    location = /pdf.worker.min.mjs {
        default_type application/javascript;
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    # Módulos ES y archivos con hash
    location ~* \.(js|css|mjs)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location ~* \.(png|jpg|jpeg|gif|svg|ico|woff2?|ttf|eot|map)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ── index.html — sin caché ─────────────────────────────────────────
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
        try_files $uri =404;
    }

    # ── SPA Routing (HTML5 history) ────────────────────────────────────
    # Todas las rutas que no sean archivos van a index.html
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # ── Health check ───────────────────────────────────────────────────
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}
