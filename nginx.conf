# ─────────────────────────────────────────────────────────────────────
# nginx.conf — Servidor PQRSF Frontend
#
# Responsabilidades:
#   1. Servir el bundle React (SPA) con HTML5 history routing.
#   2. Proxy HTTP → backend Django:  /api/  /media/  /admin/  /static/
#   3. Proxy WebSocket → backend Django: /ws/
#   4. Cabeceras de seguridad HTTP recomendadas.
#
# El nombre 'web' en proxy_pass referencia al servicio del mismo nombre
# definido en docker-compose.yml (red interna de Docker).
# ─────────────────────────────────────────────────────────────────────

# El host termina SSL y reenvía como HTTP plano a este contenedor, así que
# $scheme siempre vale "http" aquí. Si el proxy del host ya envió
# X-Forwarded-Proto (p. ej. "https"), lo respetamos; si no vino ninguno,
# usamos $scheme como último recurso. Esto evita que Django construya URLs
# absolutas (build_absolute_uri) con esquema http en un sitio servido por https.
map $http_x_forwarded_proto $real_scheme {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80;
    server_name _;

    # El host termina SSL y reenvía como HTTP plano a este contenedor, así que
    # $scheme aquí siempre es "http". Sin esto, cualquier redirect interno
    # (alias sin trailing slash, try_files, etc.) generaría Location: http://
    # y el navegador lo bloquea como mixed content en el sitio HTTPS.
    absolute_redirect off;

    root /usr/share/nginx/html;
    index index.html;

    # ── Tamaño máximo de upload ────────────────────────────────────────
    # Límite general: 25 MB (incluye Excel de planes de aula de hasta 20 MB).
    # El endpoint de hero images (/api/pqrs/hero-images/) sobreescribe a 50 MB
    # ya que solo es accesible por administradores (IsAdminUser).
    client_max_body_size 25M;
    client_body_buffer_size 1M;

    # ── Content Security Policy ────────────────────────────────────────
    # Permite conexiones al backend (mismo origen) y a Google OAuth/APIs.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://accounts.google.com https://www.google.com https://www.gstatic.com; style-src 'self' 'unsafe-inline' https://accounts.google.com https://fonts.googleapis.com; img-src 'self' data: blob: https:; connect-src 'self' http: https: ws: wss: https://accounts.google.com https://generativelanguage.googleapis.com https://api.groq.com; frame-src 'self' blob: https://accounts.google.com https://www.google.com; font-src 'self' data: https://fonts.gstatic.com; object-src 'none'; base-uri 'self';" always;

    # ── Resolver DNS de Docker ─────────────────────────────────────────
    # Fuerza re-resolución del hostname 'web' cada 10s usando el DNS
    # interno de Docker (127.0.0.11), necesario para que Nginx no cache
    # la IP del contenedor web si este se reinicia o recrea.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_host web:8000;
    set $academic_host CLASSROOM_PLAN_SERVICE:8001;
    set $quiz_host quiz_service:3000;
    set $unidoc_host unidoc_service:10000;
    set $reportes_host reportes_frontend:80;
    set $consultorio_host consultorio_service:3000;

    # ── Proxy WebSocket Quiz (Socket.io) ─────────────────────────────
    location ^~ /quiz-app/api/socket {
        proxy_pass             http://$quiz_host;
        proxy_http_version     1.1;
        proxy_set_header       Upgrade    $http_upgrade;
        proxy_set_header       Connection "upgrade";
        proxy_set_header       Host       $host;
        proxy_set_header       X-Real-IP  $remote_addr;
        proxy_set_header       X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header       X-Forwarded-Proto $real_scheme;
        proxy_read_timeout     86400s;
        proxy_send_timeout     86400s;
    }

    # ── Proxy Quiz completo en subruta del mismo dominio ─────────────
    location ^~ /quiz-app/ {
        proxy_pass         http://$quiz_host;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $real_scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        add_header         X-Frame-Options   "SAMEORIGIN" always;
    }

    # ── Archivos estáticos del bundle (cache agresivo) ─────────────────
    # PDF.js worker — URL estable sin hash, caché corta para permitir actualizaciones.
    location = /pdf.worker.min.mjs {
        default_type application/javascript;
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    # Módulos ES (.mjs) con hash — caché larga.
    location ~* \.mjs$ {
        default_type application/javascript;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?|ttf|eot|map)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ── index.html — sin caché para que el browser siempre cargue el bundle más reciente ─
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
        try_files $uri =404;
    }

    # ── SPA — React Router (HTML5 history) ────────────────────────────
    # Cualquier ruta que no sea un archivo real devuelve index.html
    # para que React Router maneje la navegación en el cliente.
    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
        try_files $uri $uri/ /index.html;
    }

    # ── Proxy Sistema de Reportes bajo /reportes-app/ ────────────────────
    location ^~ /reportes-app/ {
        rewrite ^/reportes-app/?(.*)  /$1 break;
        proxy_pass         http://$reportes_host;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $real_scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_buffer_size          128k;
        proxy_buffers              4 256k;
        proxy_busy_buffers_size    256k;
    }

    # ── Proxy Consultorio Jurídico bajo /consultorio-app/ ────────────────
    # El frontend Next.js corre con basePath=/consultorio-app (ver
    # consultorio-juridico/next.config.ts), así que NO se reescribe la ruta.
    # Auth/DB/Storage (Supabase) NO pasan por este proxy: el navegador habla
    # directo con el stack Supabase self-hosted en su propio subdominio
    # (api.consultorio.<dominio>).
    location ^~ /consultorio-app {
        proxy_pass         http://$consultorio_host;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $real_scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        add_header         X-Frame-Options   "SAMEORIGIN" always;
    }

    # ── Proxy REST API Servicio Academico (NOVA) ─────────────────────
    # Ruta publica en el mismo dominio del frontend, redirigida a puerto interno.
    location /api/planes-aula/ {
        proxy_pass         http://$academic_host;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $real_scheme;
        proxy_connect_timeout 30s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        add_header Access-Control-Allow-Private-Network "true" always;
    }

    # ── Proxy portal UniDoc embebido (Convocatorias) ──────────────────
    location ^~ /convocatorias-app/ {
        proxy_pass         http://unidoc_service:10000/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $real_scheme;
        proxy_set_header   X-Forwarded-Host  $host;
        proxy_set_header   X-Forwarded-Prefix /convocatorias-app;
        proxy_redirect     ~^/(.*)$ /convocatorias-app/$1;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        client_max_body_size 50M;
        add_header         X-Frame-Options   "SAMEORIGIN" always;
    }

    # ── Proxy storage Laravel UniDoc (URLs sin prefijo /convocatorias-app) ──
    # asset('storage/...') genera URLs sin subpath cuando APP_URL no incluye el prefijo.
    # Esta ruta garantiza que /storage/ siempre resuelva al contenedor unidoc_service.
    location ^~ /storage/ {
        proxy_pass         http://unidoc_service:10000/storage/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $real_scheme;
        proxy_read_timeout 60s;
    }

    # ── Proxy REST API → backend Django ───────────────────────────────
    location /api/ {
        proxy_pass         http://$backend_host;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $real_scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        # Permite que el navegador envíe peticiones cross-origin a esta ruta
        # cuando el frontend se sirve desde una IP pública y el backend está en
        # red privada (Private Network Access / CORS-RFC1918 de Chrome 104+).
        add_header Access-Control-Allow-Private-Network "true" always;
    }

    # ── Subida de imágenes hero (solo admin) — límite extendido ───────
    # IsAdminUser en el backend garantiza que solo staff puede usar este límite.
    location /api/pqrs/hero-images/ {
        client_max_body_size 50M;
        proxy_pass         http://$backend_host;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $real_scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        add_header Access-Control-Allow-Private-Network "true" always;
    }

    # ── Subida de documentos del chatbot (solo admin) — límite extendido ──
    # IsAdminUser en el backend garantiza que solo staff puede usar este límite.
    # El OCR de documentos escaneados corre en segundo plano vía Celery, así que
    # esta petición responde rápido (solo guarda el archivo y encola la tarea).
    location /api/pqrs/chatbot-config/ {
        client_max_body_size 50M;
        proxy_pass         http://$backend_host;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $real_scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        add_header Access-Control-Allow-Private-Network "true" always;
    }

    # ── Subida de recursos del manual: videos y PDFs (solo admin) ──────
    # IsAdminUser en el backend garantiza que solo staff puede usar este límite.
    # Los videos instructivos pueden pesar hasta 200 MB (ver settings.py).
    location /api/pqrs/manual-resources/ {
        client_max_body_size 200M;
        proxy_pass         http://$backend_host;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $real_scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        add_header Access-Control-Allow-Private-Network "true" always;
    }

    # ── Proxy WebSocket → backend Daphne ──────────────────────────────
    # Daphne gestiona upgrade HTTP → WS en el mismo puerto 8000.
    location /ws/ {
        proxy_pass             http://$backend_host;
        proxy_http_version     1.1;
        proxy_set_header       Upgrade    $http_upgrade;
        proxy_set_header       Connection "upgrade";
        proxy_set_header       Host       $host;
        proxy_set_header       X-Real-IP  $remote_addr;
        proxy_read_timeout     86400s;   # Mantener WS vivo (24 h)
        proxy_send_timeout     86400s;
    }

    # ── Archivos multimedia (servidos directamente desde volumen compartido) ──
    # El contenedor frontend monta media_data en /usr/share/nginx/html/media.
    # Se diferencia el comportamiento de caché según privacidad del contenido:
    #
    #   /media/hero/      → imágenes públicas de landing, caché larga (7 días).
    #   /media/* (resto)  → adjuntos de PQRS/tickets/certificados: sin caché
    #                       y forzados como descarga para evitar ejecución en
    #                       navegador. Los UUIDs en el nombre de archivo
    #                       dificultan la enumeración de rutas.
    #
    # ^~ evita que la regla regex de .png/.jpg capture estas rutas primero.
    location ^~ /media/hero/ {
        alias   /usr/share/nginx/html/media/hero/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Los adjuntos PQRS son privados. Django los entrega mediante el endpoint
    # autenticado /api/pqrs/<pqrs_id>/attachments/<id>/download/.
    location ^~ /media/pqrs/ {
        add_header Cache-Control "no-store" always;
        return 404;
    }

    # Planes de trabajo (PDF) de Elecciones: se sirven inline (sin forzar
    # descarga) para permitir la previsualización en el modal de validación
    # de Registro y Control. Nombres de archivo UUID, no enumerables.
    location ^~ /media/elecciones/registro_academico_planes/ {
        alias   /usr/share/nginx/html/media/elecciones/registro_academico_planes/;
        expires -1;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location ^~ /media/elecciones/planes_trabajo/ {
        alias   /usr/share/nginx/html/media/elecciones/planes_trabajo/;
        expires -1;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location ^~ /media/ {
        alias   /usr/share/nginx/html/media/;
        expires -1;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Disposition "attachment" always;
        try_files $uri =404;
    }

    # ── Panel de administración Django ────────────────────────────────────
    # Movido a /django-admin/ para evitar colisión con la ruta React /admin.
    location /django-admin/ {
        proxy_pass       http://$backend_host;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $real_scheme;
    }

    # ── Archivos estáticos de Django (admin CSS/JS) ────────────────────
    # ^~ evita que la regla regex de .css/.js capture estas rutas primero.
    location ^~ /static/ {
        proxy_pass       http://$backend_host;
        proxy_set_header Host $host;
    }

    # ── Cabeceras de seguridad ─────────────────────────────────────────
    add_header X-Content-Type-Options    "nosniff"                        always;
    add_header X-Frame-Options           "DENY"                           always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    # microphone=(self) — permite el micrófono en el propio origen (TTS/STT de accesibilidad).
    # camera y geolocation permanecen bloqueadas.
    add_header Permissions-Policy        "camera=(), microphone=(self), geolocation=()" always;

    # ── Compresión gzip ────────────────────────────────────────────────
    gzip            on;
    gzip_types      text/plain text/css application/json application/javascript
                    text/xml application/xml application/xml+rss text/javascript
                    image/svg+xml;
    gzip_min_length 1024;
}
